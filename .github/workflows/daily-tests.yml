name: Daily tests

on:
    schedule:
        - cron: "0 12 * * *"
    workflow_dispatch:

jobs:
    tests:
        uses: ./.github/workflows/test.yml
        secrets: inherit
        permissions:
            contents: read

    notify-on-failure:
        runs-on: ubuntu-latest
        needs: [tests]
        if: failure()
        permissions: {}
        steps:
            - uses: dawidd6/action-send-mail@v22
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  subject: "CI Failure: `sistence` Daily tests"
                  # The NOTIFY_EMAIL repository variable, else the sending account itself.
                  to: ${{ vars.NOTIFY_EMAIL || secrets.MAIL_USERNAME }}
                  from: sistence
                  body: |
                      The daily test run for the sistence repository has failed.

                      Tests: ${{ needs.tests.result }}

                      Please review the workflow run at https://github.com/CodyCBakerPhD/sistence/actions/workflows/daily-tests.yml
