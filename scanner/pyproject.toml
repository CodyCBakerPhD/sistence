[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sistence-scanner"
version = "0.1.0"
description = "Runs con/sistent over the repositories named on the `config` branch and appends the result to the `data` branch."
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Cody Baker" }]
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# The scan itself also needs `sistent`, which is not on PyPI yet; the scan workflow installs it from git.
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = [
    "sistence-scanner[test]",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-jsonschema",
]
# Pinned, so that the JSON Schema export it produces is byte-for-byte reproducible in CI.
schema = [
    "linkml==1.12.1",
]

[project.scripts]
sistence-scan = "sistence_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sistence_scanner"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PIE", "PT", "RET"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
markers = ["linkml: needs the `schema` extra (LinkML) installed"]

[tool.mypy]
python_version = "3.11"
files = ["src/sistence_scanner"]
strict = true
warn_unreachable = true
